<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PiPrime</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--p1:#3b0764;--p2:#4c1d95;--p3:#6b21a8;--gold:#fbbf24;--bg:#f4f3f8;--ink:#1e1b4b;--mut:#64748b;--line:#e2e8f0}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:84px;line-height:1.55}
button,input,select,textarea{font-family:inherit}
button{cursor:pointer;border:0}
.hdr{background:linear-gradient(160deg,var(--p2),var(--p1));color:#fff;padding:16px 16px 22px;border-radius:0 0 26px 26px}
.wrap{max-width:960px;margin:0 auto}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:14px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:20px}
.logo{width:40px;height:40px;border-radius:12px;background:var(--gold);color:var(--p1);display:flex;align-items:center;justify-content:center;font-size:22px}
.ctl{display:flex;gap:8px}
.chip{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.3);padding:7px 12px;border-radius:999px;font-weight:700;font-size:12.5px}
.chip.on{background:rgba(16,185,129,.25);color:#a7f3d0}
.chip option{color:#000}
.search{background:#fff;border-radius:16px;padding:6px 12px;display:flex;gap:8px;margin-top:6px}
.search input{flex:1;border:0;outline:0;font-size:14px;background:none;color:var(--ink)}
.gold{background:var(--gold);color:var(--ink);font-weight:800;border-radius:11px;padding:9px 16px;font-size:13px}
main{max-width:960px;margin:0 auto;padding:16px}
.status{background:#fff;border:1px solid #ddd6fe;border-inline-start:4px solid #7c3aed;border-radius:14px;padding:10px 14px;font-size:12.5px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.cats{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.cats button{background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:8px 14px;font-weight:700;font-size:12.5px;white-space:nowrap;color:var(--mut)}
.cats button.on{background:var(--p2);color:#fff;border-color:var(--p2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.card{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;display:flex;flex-direction:column}
.thumb{height:130px;background:linear-gradient(135deg,var(--p2),var(--p3));display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:30px;font-weight:800;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb svg{width:52%;height:52%}
.detail .hero svg{width:34%;height:72%}
.cats button svg{width:17px;height:17px;vertical-align:-4px;margin-inline-end:5px}
.cb{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1}
.nm{font-weight:800;font-size:15px;cursor:pointer}
.ds{font-size:12px;color:#475569;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.own{font-size:11.5px;color:var(--mut)}
.pr{font-weight:800;color:var(--p3);margin-top:auto}
.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.soft{background:#f3e8ff;color:var(--p2);border:1px solid #d8b4fe;border-radius:10px;padding:8px;font-weight:800;font-size:12px}
.gold.s{padding:8px;border-radius:10px;font-size:12px}
.empty{grid-column:1/-1;background:#fff;border:1.5px dashed #c4b5fd;border-radius:20px;padding:34px 18px;text-align:center}
.empty h3{color:var(--p1);margin-bottom:6px}
.empty p{color:var(--mut);font-size:13px;margin-bottom:14px}
.detail{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}
.detail .hero{height:190px;border-radius:16px;overflow:hidden;background:linear-gradient(135deg,var(--p1),var(--p3));display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:48px;margin:12px 0}
.detail .hero img{width:100%;height:100%;object-fit:cover}
.back{background:#f1f5f9;color:var(--ink);padding:8px 14px;border-radius:11px;font-weight:800;font-size:13px}
.spec{background:#f8fafc;border-radius:11px;padding:10px 12px;font-size:13px;display:flex;justify-content:space-between;margin-top:8px}
.pay{background:var(--p2);color:#fff;border-radius:13px;padding:12px;font-weight:800;font-size:14px}
.rep{background:none;color:var(--mut);font-weight:700;font-size:12.5px;width:100%;margin-top:12px;padding:8px;text-decoration:underline}
.del{background:#fee2e2;color:#991b1b;border-radius:11px;padding:10px;font-weight:800;width:100%;margin-top:10px}
.nav{direction:rtl;position:fixed;inset:auto 0 0 0;background:#fff;border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:8px 2px calc(10px + env(safe-area-inset-bottom,0px));z-index:50}
.nav button{background:none;display:flex;flex-direction:column;align-items:center;font-size:11px;font-weight:700;color:var(--mut)}
.nav button.on{color:var(--p2);font-weight:800}
.nav span{font-size:18px}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.65);display:none;align-items:flex-end;justify-content:center;z-index:100;padding:14px}
.modal.open{display:flex}
.mc{background:#fff;border-radius:22px;width:100%;max-width:520px;max-height:86vh;overflow-y:auto;padding:20px 20px 40px}
.mh{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.mh h3{color:var(--p1);font-size:17px}
.x{background:#f1f5f9;width:30px;height:30px;border-radius:9px;font-size:18px}
.fg{margin-bottom:11px}
.fg label{display:block;font-size:12.5px;font-weight:800;color:var(--p2);margin-bottom:4px}
.fg input,.fg select,.fg textarea{width:100%;border:1px solid #cbd5e1;border-radius:11px;padding:9px 12px;font-size:13.5px;outline:0}
.err{color:#b91c1c;font-size:12px;margin-bottom:8px;min-height:16px}
.full{width:100%;background:var(--p2);color:#fff;padding:11px;border-radius:12px;font-weight:800;font-size:14.5px}
.li{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #f1f5f9}
.ord{border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}
.shipbox{background:#faf5ff;border-radius:10px;padding:8px 10px;margin-top:6px;font-size:12.5px}
footer{text-align:center;font-size:12px;color:var(--mut);margin-top:26px}
footer a{color:var(--p3);font-weight:700;text-decoration:none;margin:0 8px}
:focus-visible{outline:2px solid var(--p3);outline-offset:2px}
/* شبكة: 3 خانات بكل صف، والصفوف تحت بعض */
.card{min-width:0;border-radius:14px}
.thumb{height:auto;aspect-ratio:1/1}
.thumb svg{width:56%;height:56%}
.cb{padding:7px 8px 8px;gap:2px}
.nm{font-size:12px;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.ds,.own{display:none}
.pr{font-size:12px}
.row{grid-template-columns:1fr;margin-top:4px}
.row .soft{display:none}
.gold.s{padding:6px;font-size:11px}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}}
/* أزرار الأقسام: 3 خانات بكل صف، أيقونة فوق والاسم تحتها */
.cats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;overflow:visible;padding-bottom:0;margin-bottom:12px}
.cats button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:10px 4px;white-space:normal;text-align:center;line-height:1.25;border-radius:14px;min-width:0}
.cats button svg{width:26px;height:26px;margin:0;vertical-align:baseline}
@media(min-width:700px){.cats{grid-template-columns:repeat(6,1fr)}}
</style>
</head>
<body>
<header class="hdr"><div class="wrap">
  <div class="bar">
    <div class="ctl">
      <button id="authBtn" class="chip" data-act="connect"></button>
      <select id="lang" class="chip"><option value="ar">العربية</option><option value="en">English</option></select>
    </div>
    <div class="brand">PiPrime <div class="logo">π</div></div>
  </div>
  <div class="search"><input id="q" type="search" autocomplete="off"><button class="gold" data-act="render" id="searchBtn"></button></div>
</div></header>

<main>
  <div class="status"><span id="status"></span><button class="gold s" data-act="add" id="addBtn"></button></div>
  <section id="home">
    <div class="cats" id="cats"></div>
    <div class="grid" id="grid"></div>
  </section>
  <section id="detail" hidden></section>
  <footer><a href="privacy.html" id="fPriv"></a><a href="terms.html" id="fTos"></a><div style="margin-top:6px" id="net"></div></footer>
</main>

<nav class="nav">
  <button id="nHome" class="on" data-act="home"><span>🏠</span><b id="tHome"></b></button>
  <button id="nOrd" data-act="orders"><span>📦</span><b id="tOrd"></b></button>
  <button id="nCart" data-act="cart"><span>🛒</span><b id="tCart"></b></button>
  <button id="nAcc" data-act="account"><span>👤</span><b id="tAcc"></b></button>
</nav>

<div id="modal" class="modal"><div class="mc">
  <div class="mh"><h3 id="mTitle"></h3><button class="x" data-act="close" aria-label="close">×</button></div>
  <div id="mBody"></div>
</div></div>

<script>
"use strict";
/* ============ Config ============ */
const API = "https://piprime-api.alhwryh311.workers.dev";
const SANDBOX = true;               // غيّرها إلى false عند الانتقال إلى Mainnet
const CART_KEY = "piprime_cart_v2", LANG_KEY = "piprime_lang_v1", SHIP_KEY = "piprime_ship_v1";
const CATS = ["fashion","sports","beauty","auto","gaming","electronics","home","stores","services"];

/* ============ Category art ============ */
// لاستبدال الأيقونة بصورة حقيقية لقسم: ضع رابط https هنا، مثل: fashion: "https://.../fashion.jpg"
const CAT_PHOTO = {};
const CATSVG = {

 auto:'<path d="M6 33l4-11h28l4 11v7h-6v-4H12v4H6z"/><circle cx="14" cy="31" r="2"/><circle cx="34" cy="31" r="2"/><path d="M10 22l2-6h24l2 6"/>',

 home:'<path d="M9 18h23v12a8 8 0 0 1-8 8h-7a8 8 0 0 1-8-8zM32 21h4a4 4 0 0 1 0 8h-4M15 8v5M21 8v5M27 8v5"/>',
 stores:'<path d="M7 18l3-8h28l3 8M7 18h34v22H7zM7 18c0 4 6 4 8.5 0 2.5 4 6.5 4 8.5 0 2 4 6 4 8.5 0 2.5 4 8.5 4 8.5 0M20 40V28h8v12"/>',
 services:'<path d="M31 7a8 8 0 0 0-8 11L7 34a4 4 0 0 0 7 7l16-16a8 8 0 0 0 11-8l-6 5-5-1-1-5z"/>'
};
const CATBG = {fashion:["#be185d","#6b21a8"],sports:["#047857","#1e3a8a"],beauty:["#db2777","#7c3aed"],auto:["#334155","#4c1d95"],gaming:["#4338ca","#6b21a8"],electronics:["#0e7490","#3b0764"],home:["#92400e","#4c1d95"],stores:["#6d28d9","#be185d"],services:["#0f766e","#4c1d95"]};
const icon = c => `<svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${CATSVG[c] || ""}</svg>`;
const bg = c => { const g = CATBG[c] || ["#4c1d95","#6b21a8"]; return ` style="background:linear-gradient(135deg,${g[0]},${g[1]})"`; };

/* ============ Texts ============ */
const TX = {
ar:{dir:"rtl",connect:"ربط حساب Pi",search:"بحث",ph:"ابحث عن منتج أو خدمة...",all:"الكل",mine:"منتجاتي",
 fashion:"ملابس",sports:"أدوات رياضية",beauty:"تجميل النساء",auto:"إكسسوارات سيارات",gaming:"قيمنغ",electronics:"إلكترونيات",home:"منزل وقهوة",stores:"المتاجر",services:"خدمات",
 add:"+ أضف منتجك",home_:"الرئيسية",cart:"السلة",acc:"حسابي",open:"فتح",addCart:"+ السلة",addCartFull:"إضافة للسلة",payPi:"دفع بـ Pi",
 back:"← رجوع",seller:"التاجر",cat:"القسم",price:"السعر",count:"عنصر",
 emptyT:"لا توجد منتجات بعد",emptyD:"كن أول تاجر ينشر منتجه هنا.",loading:"جارٍ التحميل...",
 newT:"إضافة منتج",name:"اسم المنتج *",desc:"الوصف *",img:"رابط صورة https (اختياري)",publish:"نشر المنتج",
 del:"🗑️ حذف هذا المنتج",delQ:"حذف هذا المنتج نهائياً؟",deleted:"✓ تم حذف المنتج",
 needPi:"افتح التطبيق داخل Pi Browser لتسجيل الدخول.",needLogin:"سجّل الدخول بحساب Pi أولاً.",
 cartEmpty:"السلة فارغة.",oneSeller:"السلة تقبل منتجات من تاجر واحد فقط. أتمم الدفع أو أفرغ السلة أولاً.",
 inCart:"✓ أُضيف للسلة",total:"المجموع",myItems:"منتجاتي",privacy:"سياسة الخصوصية",tos:"شروط الاستخدام",
 netNote:"PiPrime • Pi Testnet",ready:"جاهز",paid:"✓ اكتملت الدفعة",cancelled:"أُلغيت الدفعة",pendingDone:"✓ اكتملت الدفعة المعلّقة",pendingCancel:"أُلغيت الدفعة المعلّقة",
 fill:"أكمل الحقول المطلوبة وسعراً أكبر من صفر.",saving:"جارٍ النشر...",orders:"طلباتي",noOrders:"لا توجد طلبات بعد.",st_paid:"مدفوع",st_shipped:"تم الشحن",st_received:"تم الاستلام",markShipped:"تم الشحن",markReceived:"تأكيد الاستلام",asBuyer:"شراء",asSeller:"بيع",report:"🚩 إبلاغ عن هذا المنتج",repT:"إبلاغ عن منتج",repWhy:"سبب البلاغ",repNote:"تفاصيل إضافية (اختياري)",repSend:"إرسال البلاغ",repDone:"✓ وصلنا بلاغك وسنراجعه. شكراً لك.",r_prohibited:"منتج ممنوع (أسلحة، مخدرات...)",r_fake:"مقلّد أو مزيّف",r_scam:"احتيال أو نصب",r_adult:"محتوى للبالغين",r_other:"سبب آخر",repOwn:"لا يمكنك الإبلاغ عن منتجك.",
 shipT:"عنوان التوصيل",sName:"الاسم الكامل *",sPhone:"رقم الهاتف *",sCity:"المدينة *",sAddr:"العنوان التفصيلي *",sNote:"ملاحظات للتاجر (اختياري)",sGo:"متابعة إلى الدفع",sNeed:"أكمل الاسم والهاتف والمدينة والعنوان.",sTo:"التوصيل إلى",payOk:"✓ تم تحويل المبلغ للتاجر",payFail:"تعذّر التحويل، سيُعاد تلقائياً",payWait:"بانتظار التحويل للتاجر"},
en:{dir:"ltr",connect:"Connect Pi",search:"Search",ph:"Search products or services...",all:"All",mine:"My products",
 fashion:"Fashion",sports:"Sports",beauty:"Women's beauty",auto:"Auto accessories",gaming:"Gaming",electronics:"Electronics",home:"Home & coffee",stores:"Stores",services:"Services",
 add:"+ Add product",home_:"Home",cart:"Cart",acc:"Account",open:"Open",addCart:"+ Cart",addCartFull:"Add to cart",payPi:"Pay with Pi",
 back:"← Back",seller:"Seller",cat:"Category",price:"Price",count:"items",
 emptyT:"No products yet",emptyD:"Be the first merchant to list a product here.",loading:"Loading...",
 newT:"Add product",name:"Product name *",desc:"Description *",img:"https image URL (optional)",publish:"Publish product",
 del:"🗑️ Delete this product",delQ:"Delete this product permanently?",deleted:"✓ Product deleted",
 needPi:"Open the app inside Pi Browser to sign in.",needLogin:"Sign in with Pi first.",
 cartEmpty:"Your cart is empty.",oneSeller:"A cart can hold items from one seller only. Pay or empty the cart first.",
 inCart:"✓ Added to cart",total:"Total",myItems:"My products",privacy:"Privacy Policy",tos:"Terms of Service",
 netNote:"PiPrime • Pi Testnet",ready:"Ready",paid:"✓ Payment completed",cancelled:"Payment cancelled",pendingDone:"✓ Pending payment completed",pendingCancel:"Pending payment cancelled",
 fill:"Fill the required fields and set a price above zero.",saving:"Publishing...",orders:"Orders",noOrders:"No orders yet.",st_paid:"Paid",st_shipped:"Shipped",st_received:"Received",markShipped:"Mark as shipped",markReceived:"Confirm received",asBuyer:"Purchase",asSeller:"Sale",report:"🚩 Report this product",repT:"Report product",repWhy:"Reason",repNote:"Extra details (optional)",repSend:"Send report",repDone:"✓ Report received. We will review it. Thank you.",r_prohibited:"Prohibited item (weapons, drugs...)",r_fake:"Counterfeit or fake",r_scam:"Scam or fraud",r_adult:"Adult content",r_other:"Other",repOwn:"You cannot report your own product.",
 shipT:"Delivery address",sName:"Full name *",sPhone:"Phone number *",sCity:"City *",sAddr:"Street address *",sNote:"Note to seller (optional)",sGo:"Continue to payment",sNeed:"Fill in name, phone, city and address.",sTo:"Deliver to",payOk:"✓ Payout sent to seller",payFail:"Payout failed, will retry",payWait:"Payout pending"}
};

/* ============ State ============ */
let lang = localStorage.getItem(LANG_KEY) || "ar";
if (!TX[lang]) lang = "ar";
let user = null, token = "", products = [], loaded = false;
let cat = "all", openId = null, cart = [];
try { cart = JSON.parse(localStorage.getItem(CART_KEY) || "[]"); } catch (e) { cart = []; }

const $ = id => document.getElementById(id);
const t = k => TX[lang][k] ?? TX.ar[k] ?? k;
const unit = () => SANDBOX ? "Test-Pi" : "Pi";
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const httpsUrl = u => { try { const p = new URL(String(u || "").trim()); return p.protocol === "https:" ? p.href : ""; } catch (e) { return ""; } };
const me = () => user ? "@" + user.username : "";
const isMine = p => me() && String(p.owner).toLowerCase() === me().toLowerCase();
const setStatus = m => { $("status").textContent = m; };
const catLabel = c => t(c) || c;
const saveCart = () => { try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (e) {} };

/* ============ API ============ */
async function api(path, body, auth) {
  const headers = { "Content-Type": "application/json" };
  if (auth && token) headers.Authorization = "Bearer " + token;
  const r = await fetch(API + path, body === undefined ? (auth && token ? { headers } : {}) : { method: "POST", headers, body: JSON.stringify(body) });
  let d = null; try { d = await r.json(); } catch (e) {}
  if (!r.ok || (d && d.ok === false)) throw new Error((d && d.error) || "HTTP " + r.status);
  return d;
}
async function loadProducts() {
  try {
    const d = await api("/api/products");
    products = (d.products || []).slice().reverse().map(p => ({
      id: String(p.id), title: p.title, desc: p.description || "", cat: p.cat,
      amount: Number(p.amount) || 0, owner: p.owner || "", img: httpsUrl(p.img)
    }));
  } catch (e) { setStatus("Error: " + e.message); }
  loaded = true; render();
}

/* ============ Pi auth & payments ============ */
const hasPi = () => typeof window.Pi !== "undefined";
if (hasPi()) { try { Pi.init({ version: "2.0", sandbox: SANDBOX }); } catch (e) {} }

const pendingInc = [];
function onIncomplete(p) { if (p && p.identifier) pendingInc.push(p); }
async function flushIncomplete() {
  while (pendingInc.length) {
    const p = pendingInc.shift();
    try {
      const txid = p.transaction && p.transaction.txid;
      await api("/api/pi/" + (txid ? "complete" : "cancel"), txid ? { paymentId: p.identifier, txid } : { paymentId: p.identifier }, true);
      setStatus(txid ? t("pendingDone") : t("pendingCancel"));
    } catch (e) { setStatus("Pending payment error: " + e.message); }
  }
}
async function connect() {
  if (user) return true;
  if (!hasPi()) { modal(t("connect"), `<p>${esc(t("needPi"))}</p>`); return false; }
  $("authBtn").textContent = "...";
  try {
    const a = await Pi.authenticate(["username", "payments", "wallet_address"], onIncomplete);
    user = a.user; token = a.accessToken;
    flushIncomplete();
    $("authBtn").classList.add("on");
    $("authBtn").textContent = "✓ @" + user.username;
    render();
    return true;
  } catch (e) {
    setStatus("AUTH: " + (e && e.message ? e.message : "failed"));
    $("authBtn").textContent = t("connect");
    return false;
  }
}
async function pay(amount, memo, metadata) {
  if (!(await connect())) return;
  const n = Number(amount);
  if (!(n > 0)) return;
  setStatus(memo + " (" + n + " " + unit() + ")...");
  try {
    await Pi.createPayment(
      { amount: n, memo, metadata: Object.assign({}, metadata, { buyer: user.username }) },
      {
        onReadyForServerApproval: async id => { try { await api("/api/pi/approve", { paymentId: id }, true); } catch (e) { setStatus("Approve error: " + e.message); } },
        onReadyForServerCompletion: async (id, txid) => {
          try {
            await api("/api/pi/complete", { paymentId: id, txid }, true);
            setStatus(t("paid") + " " + txid);
            if (metadata.itemIds) { cart = cart.filter(i => !metadata.itemIds.includes(i.id)); saveCart(); renderCartLabel(); }
          } catch (e) { setStatus("Complete error: " + e.message); }
        },
        onCancel: () => setStatus(t("cancelled")),
        onError: e => setStatus("Error: " + (e && e.message ? e.message : e))
      }
    );
  } catch (e) { setStatus("Error: " + (e && e.message ? e.message : e)); }
}

/* ============ Delivery address (يُطلب قبل كل دفعة) ============ */
let shipCb = null;
const loadShip = () => { try { return JSON.parse(localStorage.getItem(SHIP_KEY) || "{}"); } catch (e) { return {}; } };
async function askShip(cb) {
  if (!(await connect())) return;
  shipCb = cb;
  const s = loadShip();
  const f = (id, label, val, tag) => `<div class="fg"><label>${esc(t(label))}</label>` +
    (tag === "ta" ? `<textarea id="${id}" rows="2" maxlength="200">${esc(val)}</textarea>` : `<input id="${id}" maxlength="80" value="${esc(val)}"${tag || ""}>`) + `</div>`;
  modal(t("shipT"),
    f("sName", "sName", s.name || "", ' autocomplete="name"') + f("sPhone", "sPhone", s.phone || "", ' type="tel" autocomplete="tel"') +
    f("sCity", "sCity", s.city || "", ' autocomplete="address-level2"') + f("sAddr", "sAddr", s.addr || "", "ta") +
    f("sNote", "sNote", "", "ta") +
    `<div class="err" id="sErr"></div><button class="full" data-act="shipGo">${esc(t("sGo"))}</button>`);
}
function shipGo() {
  const v = id => $(id).value.trim();
  const ship = { name: v("sName"), phone: v("sPhone"), city: v("sCity"), addr: v("sAddr"), note: v("sNote") };
  if (!ship.name || !ship.phone || !ship.city || !ship.addr) { $("sErr").textContent = t("sNeed"); return; }
  try { localStorage.setItem(SHIP_KEY, JSON.stringify({ name: ship.name, phone: ship.phone, city: ship.city, addr: ship.addr })); } catch (e) {}
  closeModal();
  if (shipCb) shipCb(ship);
}

/* ============ Rendering ============ */
function visual(p) {
  const src = p.img || httpsUrl(CAT_PHOTO[p.cat]);
  return src ? `<img src="${esc(src)}" alt="${esc(p.title)}" loading="lazy" decoding="async" data-img data-c="${esc(p.cat)}">` : icon(p.cat);
}
function render() {
  const q = $("q").value.trim().toLowerCase();
  const list = products.filter(p => {
    if (cat === "mine") return isMine(p);
    if (cat !== "all" && p.cat !== cat) return false;
    return !q || [p.title, p.desc, p.owner, catLabel(p.cat)].some(v => String(v).toLowerCase().includes(q));
  });
  $("cats").innerHTML = ["all", ...CATS, "mine"].map(c =>
    `<button class="${c === cat ? "on" : ""}" data-cat="${c}">${CATSVG[c] ? icon(c) : ""}${esc(c === "all" ? t("all") : c === "mine" ? t("mine") : catLabel(c))}</button>`).join("");
  setStatus(loaded ? `${t("ready")} • ${list.length} ${t("count")}` : t("loading"));
  $("grid").innerHTML = !loaded ? "" : list.length === 0
    ? `<div class="empty"><h3>${esc(t("emptyT"))}</h3><p>${esc(t("emptyD"))}</p><button class="gold" data-act="add">${esc(t("add"))}</button></div>`
    : list.map(p => `<article class="card">
        <div class="thumb"${bg(p.cat)} data-open="${esc(p.id)}">${visual(p)}</div>
        <div class="cb">
          <div class="nm" data-open="${esc(p.id)}">${esc(p.title)}</div>
          <div class="ds">${esc(p.desc)}</div>
          <div class="own">${esc(p.owner)} • ${esc(catLabel(p.cat))}</div>
          <div class="pr">${p.amount} ${unit()}</div>
          <div class="row"><button class="soft" data-open="${esc(p.id)}">${esc(t("open"))}</button><button class="gold s" data-cart="${esc(p.id)}">${esc(t("addCart"))}</button></div>
        </div></article>`).join("");
  if (openId) showDetail(openId, true);
}
function showDetail(id, keepScroll) {
  const p = products.find(x => x.id === id);
  if (!p) { closeDetail(); return; }
  openId = id;
  $("home").hidden = true; $("detail").hidden = false;
  $("detail").innerHTML = `<div class="detail">
    <button class="back" data-act="closeDetail">${esc(t("back"))}</button>
    <div class="hero"${bg(p.cat)}>${visual(p)}</div>
    <h2>${esc(p.title)}</h2>
    <p style="font-size:14px;color:#475569;margin-top:6px">${esc(p.desc)}</p>
    <div class="spec"><span>${esc(t("price"))}</span><strong>${p.amount} ${unit()}</strong></div>
    <div class="spec"><span>${esc(t("cat"))}</span><strong>${esc(catLabel(p.cat))}</strong></div>
    <div class="spec"><span>${esc(t("seller"))}</span><strong>${esc(p.owner)}</strong></div>
    <div class="row" style="margin-top:14px"><button class="pay" data-pay="${esc(p.id)}">${esc(t("payPi"))}</button><button class="gold" data-cart="${esc(p.id)}">${esc(t("addCartFull"))}</button></div>
    ${isMine(p) ? `<button class="del" data-del="${esc(p.id)}">${esc(t("del"))}</button>` : `<button class="rep" data-report="${esc(p.id)}">${esc(t("report"))}</button>`}
  </div>`;
  if (!keepScroll) window.scrollTo({ top: 0, behavior: "smooth" });
}
function closeDetail() { openId = null; $("detail").hidden = true; $("detail").innerHTML = ""; $("home").hidden = false; }
function renderCartLabel() { $("tCart").textContent = `${t("cart")} (${cart.length})`; }

/* ============ Cart ============ */
function addToCart(id) {
  const p = products.find(x => x.id === id); if (!p) return;
  if (cart.some(i => i.id === id)) return;
  if (cart.length && cart[0].owner.toLowerCase() !== p.owner.toLowerCase()) { modal(t("cart"), `<p>${esc(t("oneSeller"))}</p>`); return; }
  cart.push({ id: p.id, title: p.title, amount: p.amount, owner: p.owner });
  saveCart(); renderCartLabel(); setStatus(t("inCart") + ": " + p.title);
}
function openCart() {
  if (!cart.length) { modal(t("cart"), `<p>${esc(t("cartEmpty"))}</p>`); return; }
  const total = Number(cart.reduce((s, i) => s + i.amount, 0).toFixed(4));
  modal(t("cart"), cart.map((i, k) => `<div class="li"><div><strong>${esc(i.title)}</strong><div class="own">${i.amount} ${unit()}</div></div><button class="x" data-rm="${k}">×</button></div>`).join("") +
    `<p style="margin:12px 0;font-weight:800;color:var(--p2)">${esc(t("total"))}: ${total} ${unit()}</p><button class="full" data-act="payCart">${esc(t("payPi"))}</button>`);
}
function payCart() {
  if (!cart.length) return;
  closeModal();
  const items = cart.slice(), total = Number(items.reduce((s, i) => s + i.amount, 0).toFixed(4));
  askShip(ship => pay(total, `PiPrime (${items.length})`, { itemIds: items.map(i => i.id), seller: items[0].owner, ship }));
}
function payOne(id) {
  const p = products.find(x => x.id === id); if (!p) return;
  askShip(ship => pay(p.amount, "PiPrime: " + p.title, { itemIds: [p.id], seller: p.owner, ship }));
}

/* ============ Products ============ */
function openAdd() {
  if (!user) { connect().then(ok => ok && openAdd()); return; }
  const opts = CATS.map(c => `<option value="${c}">${esc(catLabel(c))}</option>`).join("");
  modal(t("newT"), `
    <div class="fg"><label>${esc(t("name"))}</label><input id="pTitle" maxlength="80"></div>
    <div class="fg"><label>${esc(t("cat"))}</label><select id="pCat">${opts}</select></div>
    <div class="fg"><label>${esc(t("price"))} (${unit()})</label><input id="pAmount" type="number" step="0.005" min="0.005" value="0.02"></div>
    <div class="fg"><label>${esc(t("img"))}</label><input id="pImg" type="url" placeholder="https://..."></div>
    <div class="fg"><label>${esc(t("desc"))}</label><textarea id="pDesc" rows="3" maxlength="500"></textarea></div>
    <div class="err" id="pErr"></div>
    <button class="full" id="pSave" data-act="save">${esc(t("publish"))}</button>`);
}
let saving = false;
async function saveProduct() {
  if (saving) return;
  const v = id => $(id).value.trim();
  const amount = Number(v("pAmount"));
  if (!v("pTitle") || !v("pDesc") || !(amount > 0)) { $("pErr").textContent = t("fill"); return; }
  saving = true; $("pErr").textContent = t("saving");
  try {
    const d = await api("/api/products", { title: v("pTitle"), cat: v("pCat"), amount, description: v("pDesc"), img: httpsUrl(v("pImg")) }, true);
    await loadProducts(); closeModal(); cat = "all"; showDetail(String(d.product.id));
  } catch (e) { $("pErr").textContent = "Error: " + e.message; }
  saving = false;
}
async function delProduct(id) {
  if (!confirm(t("delQ"))) return;
  try {
    await api("/api/products/delete", { id }, true);
    cart = cart.filter(i => i.id !== id); saveCart(); renderCartLabel();
    closeDetail(); await loadProducts(); setStatus(t("deleted"));
  } catch (e) { setStatus("Delete error: " + e.message); }
}

/* ============ Report ============ */
const REASONS = ["prohibited","fake","scam","adult","other"];
let reportId = null, reporting = false;
async function openReport(id) {
  const p = products.find(x => x.id === id); if (!p) return;
  if (isMine(p)) { modal(t("repT"), `<p>${esc(t("repOwn"))}</p>`); return; }
  if (!(await connect())) return;
  reportId = id;
  modal(t("repT"), `<p style="margin-bottom:10px;font-weight:800">${esc(p.title)}</p>
    <div class="fg"><label>${esc(t("repWhy"))}</label><select id="rWhy">${REASONS.map(r => `<option value="${r}">${esc(t("r_" + r))}</option>`).join("")}</select></div>
    <div class="fg"><label>${esc(t("repNote"))}</label><textarea id="rNote" rows="3" maxlength="500"></textarea></div>
    <div class="err" id="rErr"></div>
    <button class="full" data-act="sendReport">${esc(t("repSend"))}</button>`);
}
async function sendReport() {
  if (reporting || !reportId) return;
  reporting = true;
  try {
    await api("/api/report", { productId: reportId, reason: $("rWhy").value, note: $("rNote").value.trim().slice(0, 500) }, true);
    $("mBody").innerHTML = `<p>${esc(t("repDone"))}</p>`; reportId = null;
  } catch (e) { $("rErr").textContent = "Error: " + e.message; }
  reporting = false;
}

/* ============ Orders ============ */
function parseShip(s) {
  if (!s) return null;
  if (typeof s === "string") { try { s = JSON.parse(s); } catch (e) { return null; } }
  return s && typeof s === "object" ? s : null;
}
async function openOrders() {
  if (!(await connect())) return;
  modal(t("orders"), `<p>${esc(t("loading"))}</p>`);
  try {
    const d = await api("/api/orders", undefined, true);
    const mine = me().toLowerCase();
    $("mBody").innerHTML = !d.orders.length ? `<p>${esc(t("noOrders"))}</p>` : d.orders.map(o => {
      const isBuyer = String(o.buyer).toLowerCase() === mine;
      const isSeller = String(o.seller).toLowerCase() === mine;
      const act = isSeller && o.status === "paid" ? ["shipped", t("markShipped")]
        : isBuyer && o.status === "shipped" ? ["received", t("markReceived")] : null;
      const names = (o.items || []).map(i => i.title).join("، ");
      const role = isBuyer && isSeller ? t("asBuyer") + " + " + t("asSeller") : t(isBuyer ? "asBuyer" : "asSeller");
      const other = isBuyer ? o.seller : o.buyer;
      const sh = parseShip(o.ship);
      const shipHtml = sh ? `<div class="shipbox"><b>${esc(t("sTo"))}:</b> ${esc(sh.name)} • <a href="tel:${esc(sh.phone)}">${esc(sh.phone)}</a><br>${esc(sh.city)}، ${esc(sh.addr)}${sh.note ? `<br><span class="own">${esc(sh.note)}</span>` : ""}</div>` : "";
      const payNote = isSeller && o.status === "received"
        ? (o.payout_status === "paid" ? t("payOk") : o.payout_status === "failed" ? t("payFail") : t("payWait")) : "";
      return `<div class="ord">
        <div style="display:flex;justify-content:space-between;gap:8px"><strong>${esc(names)}</strong><span class="own">${esc(role)}</span></div>
        <div class="own" style="margin:4px 0"><bdi>${esc(other)}</bdi> • <bdi>${Number(o.amount)} ${unit()}</bdi> • <bdi>${esc(new Date(o.created_at).toLocaleDateString(lang))}</bdi></div>
        <div style="font-weight:800;color:var(--p2)">${esc(t("st_" + o.status))}</div>
        ${shipHtml}
        ${payNote ? `<div class="own" style="margin-top:4px">${esc(payNote)}</div>` : ""}
        ${act ? `<button class="gold s" style="margin-top:8px;width:100%" data-ost="${o.id}:${act[0]}">${esc(act[1])}</button>` : ""}</div>`;
    }).join("");
  } catch (e) { $("mBody").innerHTML = `<p>Error: ${esc(e.message)}</p>`; }
}
async function setOrder(id, status) {
  try { await api("/api/orders/status", { id, status }, true); openOrders(); }
  catch (e) { setStatus("Error: " + e.message); }
}

/* ============ Account, modal, language ============ */
function openAccount() {
  const mine = products.filter(isMine);
  modal(t("acc"), `<p style="margin-bottom:10px">Pi: <strong>${user ? esc(me()) : "-"}</strong></p>` +
    (user ? `<p style="margin-bottom:10px">${esc(t("myItems"))}: <strong>${mine.length}</strong></p>` +
      mine.map(p => `<button class="soft" style="width:100%;margin-bottom:6px" data-open="${esc(p.id)}">${esc(p.title)} • ${p.amount} ${unit()}</button>`).join("")
      : `<button class="full" data-act="connect">${esc(t("connect"))}</button>`));
}
function modal(title, html) { $("mTitle").textContent = title; $("mBody").innerHTML = html; $("modal").classList.add("open"); }
function closeModal() { $("modal").classList.remove("open"); }
function applyLang() {
  const d = TX[lang];
  document.documentElement.lang = lang; document.documentElement.dir = d.dir;
  $("lang").value = lang;
  $("q").placeholder = d.ph; $("searchBtn").textContent = d.search; $("addBtn").textContent = d.add;
  if (!user) $("authBtn").textContent = d.connect;
  $("tHome").textContent = d.home_; $("tOrd").textContent = d.orders; $("tAcc").textContent = d.acc;
  $("fPriv").textContent = d.privacy; $("fTos").textContent = d.tos; $("net").textContent = d.netNote;
  renderCartLabel();
}
function setNav(id) { ["nHome","nOrd","nCart","nAcc"].forEach(n => $(n).classList.toggle("on", n === id)); }

/* ============ Events (single delegated handler) ============ */
const ACTS = {
  connect: () => { closeModal(); connect(); }, render, add: openAdd, save: saveProduct, close: closeModal,
  home: () => { closeDetail(); cat = "all"; setNav("nHome"); render(); },
  orders: () => { setNav("nOrd"); openOrders(); },
  cart: () => { setNav("nCart"); openCart(); }, account: () => { setNav("nAcc"); openAccount(); },
  closeDetail, payCart, sendReport, shipGo
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act],[data-cat],[data-open],[data-cart],[data-pay],[data-del],[data-rm],[data-report],[data-ost]");
  if (e.target.id === "modal") return closeModal();
  if (!el) return;
  const d = el.dataset;
  if (d.act && ACTS[d.act]) ACTS[d.act]();
  else if (d.cat) { closeDetail(); cat = d.cat; render(); }
  else if (d.open) { closeModal(); showDetail(d.open); }
  else if (d.cart) addToCart(d.cart);
  else if (d.pay) payOne(d.pay);
  else if (d.del) delProduct(d.del);
  else if (d.report) openReport(d.report);
  else if (d.ost) { const [oid, st] = d.ost.split(":"); setOrder(oid, st); }
  else if (d.rm !== undefined) { cart.splice(Number(d.rm), 1); saveCart(); renderCartLabel(); openCart(); }
});
document.addEventListener("error", e => {
  const img = e.target;
  if (img && img.tagName === "IMG" && img.hasAttribute("data-img")) { const c = img.dataset.c; img.insertAdjacentHTML("afterend", icon(c)); img.remove(); }
}, true);
$("q").addEventListener("input", render);
$("lang").addEventListener("change", e => {
  lang = TX[e.target.value] ? e.target.value : "ar";
  try { localStorage.setItem(LANG_KEY, lang); } catch (x) {}
  applyLang(); render();
});

applyLang(); render(); loadProducts();
</script>
</body>
</html>
