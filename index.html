<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PiTrust - Pi Testnet App</title>
  <script src="https://sdk.minepi.com/pi-sdk.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #140f26;
      color: #ffffff;
      margin: 0;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 480px;
      margin: 40px auto;
      background: #21193d;
      border: 1px solid #3c2e6b;
      border-radius: 16px;
      padding: 24px;
    }
    button {
      background: #7c3aed;
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 12px;
    }
    #status {
      margin-top: 16px;
      font-size: 14px;
      color: #d8b4fe;
      word-break: break-word;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>PiTrust</h1>
    <p>منصة وثوقية لمنتجات ومتاجر وخدمات Pi على شبكة الاختبار (Testnet).</p>
    <button id="loginBtn" onclick="connectPi()">تسجيل الدخول عبر Pi</button>
    <div id="status">جاهز للاتصال بـ Pi SDK...</div>
  </div>

  <script>
    const Pi = window.Pi;
    Pi.init({ version: "2.0", sandbox: true });

    async function connectPi() {
      const statusEl = document.getElementById("status");
      statusEl.textContent = "جاري الاتصال بحساب Pi...";
      try {
        const scopes = ["username"];
        const auth = await Pi.authenticate(scopes, () => {});
        statusEl.textContent = "تم تسجيل الدخول بنجاح: @" + auth.user.username;
      } catch (err) {
        statusEl.textContent = "تعذر الاتصال: " + (err && err.message ? err.message : err);
      }
    }
  </script>
</body>
</html>
