<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PiPrime Test</title>
<script src="https://sdk.minepi.com/pi-sdk.js"></script>
<style>
body{font-family:sans-serif;padding:16px;background:#f4f3f8;color:#1e1b4b}
input,button{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #ccc;font-size:15px}
button{background:#4c1d95;color:#fff;border:0;font-weight:bold}
pre{background:#fff;border-radius:10px;padding:10px;white-space:pre-wrap;word-break:break-all;font-size:13px}
</style>
</head>
<body>
<h3>اختبار الحماية</h3>
<input id="pid" placeholder="mp-xxxxxxxx-xxxx-...">
<input id="amt" type="number" step="0.0001" value="0.0001">
<button id="go">جرّب دفعة بمبلغ مغلوط</button>
<pre id="out">...</pre>
<script>
var API="https://piprime-api.alhwryh311.workers.dev";
var out=document.getElementById("out");
function log(m){out.textContent+="\n"+m;}
Pi.init({version:"2.0",sandbox:true});
document.getElementById("go").onclick=async function(){
  out.textContent="جارٍ الاختبار...";
  try{
    await Pi.authenticate(["username","payments"],function(){});
    await Pi.createPayment(
      {amount:Number(document.getElementById("amt").value),memo:"TAMPER TEST",metadata:{itemIds:[document.getElementById("pid").value.trim()]}},
      {
        onReadyForServerApproval:async function(id){
          var r=await fetch(API+"/api/pi/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({paymentId:id})});
          var d=await r.json();
          log("approve => HTTP "+r.status+" "+JSON.stringify(d.error||d.ok));
          log(r.status===400?"✅ الحماية تعمل":"❌ خطر: الـ Worker وافق على مبلغ غلط");
        },
        onReadyForServerCompletion:function(){log("❌ خطر: الدفعة اكتملت");},
        onCancel:function(){log("أُلغيت الدفعة");},
        onError:function(e){log("خطأ: "+(e&&e.message?e.message:e));}
      });
  }catch(e){log("خطأ: "+(e&&e.message?e.message:e));}
};
</script>
</body>
</html>
